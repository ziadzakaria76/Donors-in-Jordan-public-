# GulfTrack candidate profile.
#
# This file is the SEED. On first boot it is loaded into the database, and from
# then on the database is authoritative — every weight and keyword below is
# editable from the app's Settings screen without touching this file.
#
# Weights are integers. A job's raw score is the sum of the contributions of
# every signal that fires, then clamped to 0..100 for display. The uncapped raw
# score is retained so the breakdown always reconciles.

profile_key: fadi
display_name: "Fadi — Senior Construction & Operations Executive"

candidate:
  years_experience: 28
  nationality: Jordanian
  residence: Riyadh
  iqama_transferable: true
  accreditations: [SCE, PMP]
  languages: [Arabic, English]

salary:
  currency: SAR
  target_min: 60000
  target_max: 80000
  # Below this, the job is flagged "below target" — flagged, never hidden.
  below_target_threshold: 55000
  below_target_penalty: -15

thresholds:
  # Feed presentation bands. Also drive the Excel conditional colours.
  strong: 80
  moderate: 60
  # Cover letters are auto-drafted at or above this score (Batch C default).
  autodraft_cover_letter: 70
  # FM roles are suppressed unless they clear this bar (section 3).
  fm_rescue_floor: 75

# ---------------------------------------------------------------------------
# Lanes. A job is assigned to a lane by title match; employer match breaks ties.
# ---------------------------------------------------------------------------
lanes:
  A:
    label: "Contractor Operations / GM"
    titles:
      - Operations Director
      - Operations Manager
      - General Manager Projects
      - Projects Director
      - Director of Operations
      - MEP Operations Director
      - Construction Director
      - Deputy GM Operations
    titles_ar:
      - مدير العمليات
      - مدير عام المشاريع
      - مدير المشاريع
      - مدير الإنشاءات
      - نائب المدير العام للعمليات
  B:
    label: "Client-Side / Developer Delivery"
    titles:
      - Delivery Director
      - Project Director
      - Programme Director
      - Program Director
      - Director of Project Delivery
      - Head of MEP Delivery
      - Stadium Delivery Director
      - Director of Development
      - Head of Asset Delivery
      - Technical Director MEP
    titles_ar:
      - مدير التسليم
      - مدير البرنامج
      - مدير التطوير
      - المدير الفني

