# Project-wide Gradle settings.
#
# This file did not exist while the project was pure Kotlin — :domain needed
# none of it. Every entry below is here because the Android module requires it
# or because leaving it at the default costs real build time.

# --- Required by AGP ---
# AndroidX is not optional; the support library it replaced is long dead. AGP
# fails the build without this rather than guessing.
android.useAndroidX=true

# Each library gets its own R class instead of one that also contains every
# dependency's IDs. Smaller R classes, faster incremental builds, and it stops
# a resource from a library leaking into this module's namespace by accident.
android.nonTransitiveRClass=true

# --- JVM ---
# 4g because KSP and R8 both hold a lot at once; the default 512m sends the
# Kotlin compile daemon into a GC spiral on a module this size rather than
# failing outright, which looks like "Gradle is slow today".
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Build speed ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Kotlin ---
kotlin.code.style=official
