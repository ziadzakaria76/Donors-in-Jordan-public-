# Every version is pinned explicitly. Nothing here says "latest", nothing uses a
# dynamic range, and nothing is bumped in the middle of a milestone. On a
# conflict, step DOWN to the last known-good combination — never forward into a
# release candidate.
#
# The Android half was recorded as "proposed" in DECISIONS.md → D-2 while
# `dl.google.com` was refused, because a version that cannot be resolved cannot
# be pinned honestly. It is confirmed here by an actual resolve and an actual
# `assembleDebug`.
#
# The anchor is Kotlin 2.1.21, already confirmed against :domain. The AndroidX
# and Compose pins are therefore chosen from that same era rather than taken at
# their newest: a library compiled by a *newer* Kotlin carries metadata this
# compiler refuses to read, so "the newest of each" would not build at all.
# These are old numbers on purpose — the step-down rule applied deliberately.

[versions]
# --- Toolchain, confirmed since Milestone 0 ---
kotlin = "2.1.21"
junit = "5.11.4"
jacoco = "0.8.12"

# --- Android ---
# AGP stays on the 8.x line. 9.x is released but is explicitly out of scope.
agp = "8.13.2"
# KSP is never chosen independently: its prefix *is* the Kotlin version it was
# built against. `kotlin-kapt` appears nowhere in this project.
ksp = "2.1.21-2.0.2"
compileSdk = "36"
targetSdk = "36"
minSdk = "26"

# --- Compose ---
# One BOM pin; individual Compose artifacts deliberately carry no version.
composeBom = "2025.06.01"
# Adaptive layout is versioned separately from the BOM.
material3Adaptive = "1.1.0"

# --- AndroidX ---
androidxCore = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
navigationCompose = "2.9.0"
window = "1.4.0"
room = "2.7.2"
work = "2.10.2"
datastore = "1.1.7"

# --- Dependency injection ---
hilt = "2.56.2"
hiltNavigationCompose = "1.2.0"

# --- Screenshot and unit testing on the JVM ---
# No emulator is used or needed: Robolectric runs the Android framework on the
# JVM, and Roborazzi renders Compose to a PNG from inside it. That is what makes
# a both-language screenshot set something CI can produce on every commit.
# JUnit 4, not 5 — the Robolectric runner is a JUnit 4 runner. :domain keeps
# JUnit 5, since it has no such constraint.
junit4 = "4.13.2"
robolectric = "4.16.1"
roborazzi = "1.46.1"
androidxTestExtJunit = "1.2.1"
# Matched to the coroutines version Kotlin 2.1.21's stdlib era ships with.
coroutines = "1.10.2"

[libraries]
# --- Pure-Kotlin test stack, :domain only ---
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }

# --- Compose. Every version comes from the BOM. ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }

# --- Adaptive layout: the two-pane scaffold and the window size class ---
material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "material3Adaptive" }
material3-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "material3Adaptive" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }

# --- AndroidX foundations ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Storage ---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# --- Background work ---
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# --- Dependency injection. Compilers run under KSP, never kapt. ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Test stack for :app ---
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# The Compose compiler moved into the Kotlin plugin at Kotlin 2.0, so its
# version is the Kotlin version by definition and cannot drift out of step.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
