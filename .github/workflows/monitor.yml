name: Jordan tender monitor

# Run it from a phone.
#
# workflow_dispatch puts a "Run workflow" button on the Actions page, which
# works in a mobile browser. The schedule fires on GitHub's servers, so it does
# not depend on a device being awake, charged or on a network -- which is the
# reason this is not a Termux job on the handset.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to report"
        required: true
        default: "everything currently open"
        type: choice
        options:
          - "everything currently open"
          - "only what is new since the last run"
      portals:
        description: "Limit to these portals (space-separated keys, blank = all)"
        required: false
        default: ""
        type: string
      mode:
        description: "What to do"
        required: true
        default: "produce the report"
        type: choice
        options:
          - "produce the report"
          - "diagnose portals (--capture)"
  schedule:
    # 04:17 UTC = 07:17 Asia/Amman. Jordan is UTC+3 year-round (DST abolished
    # in 2022), so this needs no seasonal adjustment. GitHub cron is always UTC.
    #
    # NOT on the hour, deliberately. GitHub delays or drops scheduled runs under
    # load, and the top of every hour is the most contended minute on the whole
    # platform -- their own docs say to pick a different one. This workflow was
    # set to "0 4" and had fired zero times; an odd minute is the cheapest way
    # to stop competing with everyone else's midnight-and-on-the-hour crons.
    - cron: "17 4 * * 1-5"

# Never let two runs write the seen-tenders cache at once.
concurrency:
  group: jordan-tender-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r jordan_tender_monitor/requirements.txt

      # DIAGNOSIS ONLY. No portal needs a browser to produce the report any
      # more -- UNGM reads its Jordan listing from a JSON search endpoint over
      # plain HTTP. This installs ~400 MB and takes ~30s, so it runs only for
      # --capture, where a real browser earns it: capture_network() records
      # what the page requests, which is how that endpoint was found.
      - name: Install the headless browser (diagnosis only)
        if: github.event.inputs.mode == 'diagnose portals (--capture)'
        run: |
          pip install -r jordan_tender_monitor/requirements-browser.txt
          playwright install --with-deps chromium

      # New-only mode needs state to survive between runs, and a runner is
      # thrown away after each job. The cache carries the SQLite file forward.
      # A cache miss is harmless: the run simply reports the full open pipeline,
      # exactly as a first run does.
      - name: Restore the seen-tenders database
        if: github.event.inputs.scope != 'everything currently open'
        uses: actions/cache@v4
        with:
          path: jordan_tender_monitor/data
          key: seen-tenders-${{ github.run_id }}
          restore-keys: seen-tenders-

      # Diagnosis mode. --capture fetches a portal's live pages and reports,
      # per extraction layer, how many rows it found and at what quality, which
      # layer won, and the selectors the page actually uses -- derived from the
      # DOM rather than guessed. This is how an unverified selector gets
      # confirmed, and running it here means it can be done from a phone.
      - name: Diagnose portals
        if: github.event.inputs.mode == 'diagnose portals (--capture)'
        env:
          JTM_OUTPUT_FORMATS: "markdown"
        run: |
          set +e
          targets="${{ github.event.inputs.portals }}"
          # Derived from portals.json rather than listed here. A hard-coded
          # list would quietly stop covering a portal the moment one was added
          # to the file, and "diagnose everything" that skips the newest portal
          # is the one case where it is least true.
          if [ -z "$targets" ]; then
            targets=$(python -c "
from jordan_tender_monitor import portals
print(' '.join(portals.html_portals()))")
          fi
          for p in $targets; do
            echo "=============================================================="
            python jordan_tender_monitor/run.py --capture "$p"
          done
          exit 0

      - name: Upload the captured pages
        if: github.event.inputs.mode == 'diagnose portals (--capture)'
        uses: actions/upload-artifact@v4
        with:
          name: captured-pages-${{ github.run_number }}
          path: jordan_tender_monitor/tests/fixtures/live/
          if-no-files-found: warn
          retention-days: 7

      - name: Run the monitor
        id: run
        if: github.event.inputs.mode != 'diagnose portals (--capture)' 
        env:
          # A run you triggered by hand almost always wants the whole current
          # pipeline -- you are looking at it now. The schedule wants what
          # changed. The dispatch input overrides either way.
          JTM_NEW_ONLY: >-
            ${{ (github.event_name == 'schedule' ||
                 github.event.inputs.scope == 'only what is new since the last run')
                && '1' || '0' }}
          # markdown is not a deliverable; it is rendered into the run page so
          # results are readable on a phone without downloading a .docx.
          JTM_OUTPUT_FORMATS: "docx,excel,markdown"
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          python jordan_tender_monitor/run.py --run --fail-on-alert \
            ${{ github.event.inputs.portals != '' && format('--only {0}', github.event.inputs.portals) || '' }}

      # always(): the summary matters most when the run failed.
      - name: Show the results on the run page
        if: always() && github.event.inputs.mode != 'diagnose portals (--capture)' 
        run: |
          if compgen -G "jordan_tender_monitor/output/*.md" > /dev/null; then
            cat jordan_tender_monitor/output/*.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## The run produced no report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "It failed before writing anything. See the log above." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the Word and Excel reports
        if: always() && github.event.inputs.mode != 'diagnose portals (--capture)' 
        uses: actions/upload-artifact@v4
        with:
          name: jordan-tenders-${{ github.run_number }}
          path: |
            jordan_tender_monitor/output/*.docx
            jordan_tender_monitor/output/*.xlsx
          if-no-files-found: warn
          retention-days: 90
