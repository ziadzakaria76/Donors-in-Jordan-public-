name: Android emulator tests

# Runs the app on a real Android system image.
#
# WHY THIS EXISTS SEPARATELY. The unit suite runs on a JVM, where there is no
# Android Keystore, no SQLite, no notification manager and no screen. Three
# things the app depends on can therefore only be checked here:
#
#   - the token store, whose entire purpose is the Keystore;
#   - Room's generated SQL, which is written at build time and not verified
#     until it runs against a real database;
#   - whether any screen draws at all.
#
# Until this workflow existed, the answer to the last one was unknown, and
# ANDROID.md said so.
#
# REUSING THIS FOR ANOTHER PROJECT. Change `working-directory` and the matrix
# below; nothing else here is specific to this app. The two settings that
# matter on a GitHub-hosted runner are the KVM permissions step -- without it
# the emulator falls back to software rendering and times out -- and
# `emulator-options`, which disables the animations and sensors that make a
# headless emulator flaky.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-emulator.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

# Emulator jobs are slow and expensive. A newer commit makes an older run
# pointless, so let the newer one win rather than paying for both.
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # 26 is the app's minSdk and 35 its target. Testing both ends catches
        # the failures that only happen on one: the Keystore behaves
        # differently on older images, and notification permissions are a
        # runtime grant only from 33 onwards.
        api-level: [26, 35]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without this the runner's /dev/kvm is not writable by the build user
      # and the emulator silently falls back to software rendering, which does
      # not finish inside any sensible timeout. The symptom is a job that hangs
      # rather than one that fails, so it is worth doing explicitly.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Instrumented tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # google_apis rather than the bare image: AndroidX test services
          # expect it, and the bare image is missing pieces the runner needs.
          target: google_apis
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          working-directory: android
          script: |
            adb logcat -c || true
            adb logcat > logcat-api${{ matrix.api-level }}.txt &
            ./gradlew --no-daemon connectedDebugAndroidTest

      # Both of these run on failure too, and that is the point: a screenshot
      # of the screen that crashed, and the log that says why, are the only
      # evidence available for a device nobody can attach a debugger to.
      - name: Screenshot whatever is on screen
        if: always()
        continue-on-error: true
        working-directory: android
        run: |
          adb exec-out screencap -p > screen-api${{ matrix.api-level }}.png || true
          ls -l screen-api${{ matrix.api-level }}.png || true

      # The summariser is a file, not an inline heredoc. A Python heredoc
      # inside a block scalar has to terminate at column 1, which ends the
      # block scalar instead and leaves GitHub unable to parse the workflow --
      # silently, because a workflow it cannot read is one it does not run.
      - name: Say what the run found
        if: always()
        working-directory: android
        run: |
          python3 ../.github/scripts/android_test_summary.py \
            app/build/outputs/androidTest-results/connected \
            "${{ matrix.api-level }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the reports, the screenshot and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-api${{ matrix.api-level }}-${{ github.run_number }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/screen-api*.png
            android/logcat-api*.txt
          if-no-files-found: warn
          retention-days: 14
