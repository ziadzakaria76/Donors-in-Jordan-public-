name: Run monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only -- scrape and print, write nothing"
        type: boolean
        default: false
  schedule:
    # 03:00 UTC = 06:00 Europe/Amman (UTC+3, no DST). GitHub Actions cron is
    # always UTC; there is no local-time option.
    - cron: "0 3 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: the JavaScript fallback. Without this the run still works --
      # portals needing a browser report that they could not be read, and the
      # other nine carry on.
      - name: Install browser support
        run: |
          pip install -r requirements-browser.txt
          playwright install --with-deps chromium

      - name: Check portal reachability
        continue-on-error: true
        run: python -m syria_monitor.cli --check-portals
        env:
          PYTHONPATH: src

      - name: Run monitor
        env:
          PYTHONPATH: src
          # Leave the repository variable unset on a normal runner: Playwright
          # finds the browser it just installed. Set it only where a machine
          # ships its own Chromium and the download is unavailable -- an empty
          # value is ignored, so this is safe either way.
          PLAYWRIGHT_CHROMIUM_PATH: ${{ vars.PLAYWRIGHT_CHROMIUM_PATH }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m syria_monitor.cli --dry-run
          else
            python -m syria_monitor.cli --run
          fi

      # Uploaded so a run triggered from a phone can be read on the run summary
      # page without downloading anything.
      # This is how the report is delivered: download it from the run page.
      # The Markdown summary is also appended to the run summary by the CLI,
      # so portal health is visible in the run list without downloading.
      - name: Upload report files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syria-tender-report
          path: |
            output/*.docx
            output/*.xlsx
            output/*.json
            output/*-summary.md
          if-no-files-found: warn
          retention-days: 90
