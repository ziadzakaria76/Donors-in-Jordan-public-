name: Syria tender monitor

# Imported with the project from its own repository, where it lived at
# .github/workflows/run-monitor.yml. It has to sit here instead: GitHub only
# reads workflows from the repository root, so a copy left inside
# syria_tender_monitor/.github/ would look active in the diff and never run.
#
# Everything else about it is unchanged. `defaults.run.working-directory` does
# the work the move would otherwise need, so the commands below are the same
# ones the project's README documents for a local run.

on:
  workflow_dispatch:
    # THESE NAMES AND STRINGS ARE THE ANDROID APP'S, NOT THIS PROJECT'S.
    #
    # The app dispatches whichever workflow file its Settings name, and it sends
    # one fixed vocabulary: scope, portals, mode, candidate. This workflow used
    # to declare `mode` and `capture_portal` with values of its own -- so
    # pointing the app at it answered
    #
    #     422  Unexpected inputs provided: ["scope"]
    #
    # before a single step ran. workflow_dispatch rejects any input the workflow
    # does not declare, and `type: choice` is matched as a literal string, so
    # even the shared name `mode` disagreed: the app sends "produce the report"
    # and this file expected "run".
    #
    # THE SERVER IS THE CHEAP SIDE TO CHANGE. Same reasoning as the app-json
    # bridge writer: an installed APK is expensive to update and this file is
    # read fresh on every dispatch, so the adaptation lives here. The literals
    # below are copied from RunScreen.kt and PortalsRepository.kt and are
    # checked against them by tests/test_app_contract.py -- if either side is
    # edited alone, that test fails instead of a phone.
    inputs:
      scope:
        description: "What to report"
        required: true
        default: "everything currently open"
        type: choice
        options:
          - "everything currently open"
          - "only what is new since the last run"
      portals:
        description: "Limit to these portals (space-separated keys, blank = all)"
        required: false
        default: ""
        type: string
      mode:
        description: "What to do"
        required: true
        default: "produce the report"
        type: choice
        options:
          - "produce the report"
          - "diagnose portals (--capture)"
          - "test a candidate portal (--probe)"
          - "dry run -- scrape and print, write nothing"
          - "check reachability only"
      candidate:
        description: "Jordan-only. This monitor has no --probe; the run will fail and say so"
        required: false
        default: ""
        type: string
  schedule:
    # 03:17 UTC = 06:17 Europe/Amman (UTC+3, no DST). GitHub Actions cron is
    # always UTC; there is no local-time option.
    #
    # THE MINUTE IS NOT DECORATIVE. This was "0 3 * * *" and it never fired.
    # The workflow reached the default branch at 07:11 on 2026-08-29, so the
    # first run was due at 03:00 on the 30th; at 04:24 that day the API still
    # reported total_count 0 for event=schedule -- not queued, not delayed
    # behind the dispatched runs, never created.
    #
    # GitHub delays scheduled workflows under load and drops them outright,
    # and the load is worst on the hour, where every default cron in the world
    # is pointed. Moving off the boundary is the documented mitigation.
    #
    # THE SIBLING MONITOR ALREADY LEARNED THIS. monitor.yml runs at "17 4" and
    # says why: "This workflow was set to '0 4' and had fired zero times; an
    # odd minute is the cheapest way to stop competing with everyone else's
    # midnight-and-on-the-hour crons." Syria then shipped with "0 3" and fired
    # zero times. The two projects share no code, so nothing carried the fix
    # across but somebody noticing -- which is the same reason this repository
    # spent a day rediscovering four other bugs Jordan had already solved.
    #
    # It is a mitigation and not a guarantee: there is no SLA on cron, so a run
    # that matters must still be checked for rather than assumed.
    #
    # 06:17 rather than 06:00 keeps the intent -- a report waiting before the
    # working day in Amman -- and the seventeen minutes cost nothing.
    - cron: "17 3 * * *"

# Never let two runs write the seen-tenders database at once. The other two
# projects in this repository have their own groups and are unaffected.
concurrency:
  group: syria-tender-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: syria_tender_monitor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: syria_tender_monitor/requirements.txt

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: the JavaScript fallback. Without this the run still works --
      # portals needing a browser report that they could not be read, and the
      # other nine carry on.
      - name: Install browser support
        run: |
          pip install -r requirements-browser.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          PYTHONPATH: src
          # Leave the repository variable unset on a normal runner: Playwright
          # finds the browser it just installed. Set it only where a machine
          # ships its own Chromium and the download is unavailable -- an empty
          # value is ignored, so this is safe either way.
          PLAYWRIGHT_CHROMIUM_PATH: ${{ vars.PLAYWRIGHT_CHROMIUM_PATH }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          # NOT INTERPOLATED INTO THE SCRIPT. `portals` and `candidate` are free
          # text from whoever pressed Run, and `${{ }}` pastes their contents
          # into the shell before bash ever sees a quote. Through the
          # environment they stay values.
          SCOPE: ${{ inputs.scope }}
          MODE: ${{ inputs.mode }}
          PORTALS: ${{ inputs.portals }}
        run: |
          set -euo pipefail

          # read -ra splits on spaces without letting a key like "*" glob
          # against the working directory, which unquoted $PORTALS would.
          read -ra keys <<< "${PORTALS:-}"

          args=()
          for key in ${keys[@]+"${keys[@]}"}; do args+=(--portal "$key"); done

          # An empty SCOPE is the scheduled run, which sends no inputs at all --
          # there the config file decides, which is what --new-only/--no-new-only
          # being tri-state is for. A scope the user actually chose overrides it
          # in both directions: "everything currently open" has to mean
          # everything even if config.yml says otherwise, or the control lies.
          case "${SCOPE:-}" in
            "only what is new since the last run") args+=(--new-only) ;;
            "everything currently open")           args+=(--no-new-only) ;;
          esac

          case "${MODE:-}" in
            "diagnose portals (--capture)")
              # --capture takes one portal at a time; blank means all of them.
              if [ ${#keys[@]} -eq 0 ]; then keys=(all); fi
              for key in "${keys[@]}"; do
                python -m syria_monitor.cli --capture "$key"
              done
              ;;
            "test a candidate portal (--probe)")
              # Said out loud rather than quietly falling through to a scrape.
              # Jordan's monitor can trial an unconfigured portal from a JSON
              # blob; this one has no such mode, and a run that silently did
              # something else would read as if the test had passed.
              echo "::error::This monitor has no --probe mode. Testing a candidate portal is Jordan-only -- point Settings at monitor.yml for that."
              exit 1
              ;;
            "dry run"*)
              python -m syria_monitor.cli --dry-run ${args[@]+"${args[@]}"}
              ;;
            "check reachability only")
              python -m syria_monitor.cli --check-portals
              ;;
            *)
              python -m syria_monitor.cli --run ${args[@]+"${args[@]}"}
              ;;
          esac

      # This is how the report is delivered: download it from the run page.
      # The Markdown summary is also appended to the run summary by the CLI,
      # so portal health is visible in the run list without downloading.
      #
      # These paths are NOT affected by working-directory above -- upload
      # resolves them against the workspace root -- so they carry the prefix.
      - name: Upload report files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syria-tender-report-${{ github.run_number }}
          path: |
            syria_tender_monitor/output/*.docx
            syria_tender_monitor/output/*.xlsx
            syria_tender_monitor/output/*.json
            syria_tender_monitor/output/*-summary.md
            syria_tender_monitor/tests/fixtures/live/*.html
          if-no-files-found: warn
          retention-days: 90
