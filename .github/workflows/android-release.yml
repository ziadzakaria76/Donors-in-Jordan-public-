name: Android release

# Publish an installable APK as a GitHub Release.
#
# Separate from android.yml on purpose. That workflow has a `paths:` filter so
# it does not rebuild for a Python-only change -- and a `paths:` filter applies
# to tag pushes too, so putting the tag trigger there would silently skip a
# release whenever the tag's push touched nothing under android/. A release
# that quietly does not happen is exactly the failure mode this repository
# keeps designing against.
on:
  push:
    tags:
      - "v*"
  # So a release can be cut, or re-cut, from a phone.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: write   # the only job here that writes anything: the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The version code is the commit count, so the whole history is
          # needed. A shallow clone would produce versionCode 1 on every
          # release, and Android would install any of them over any other
          # without a word.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "APK_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "APK_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      # Debug-signed, deliberately, and the release notes say so. A release
      # keystore that is lost means every existing install can never be
      # updated again -- see ANDROID.md before changing this.
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name it after the version, and checksum it
        id: package
        run: |
          mkdir -p android/out
          NAME="jordan-tenders-${{ steps.version.outputs.tag }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "android/out/$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.package.outputs.name }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          cat > notes.md <<'HEADER'
          Install this on the phone: tap the `.apk` below, and allow your
          browser to install unknown apps if Android asks. No sign-in needed —
          unlike the build artifacts on the Actions tab, a Release asset
          downloads without a GitHub account.

          Full instructions, and the exact token permissions the app needs:
          [`android/ANDROID.md`](${{ github.server_url }}/${{ github.repository }}/blob/main/android/ANDROID.md).

          ### This APK is debug-signed

          That is fine for installing on your own phone and is what this
          repository does today. Two consequences worth knowing before you
          rely on it:

          - Android will warn you it is from an unknown source. Expected.
          - If this project ever switches to release signing, the new APK will
            **not** install over this one. Android identifies an app by its
            signature, so a differently-signed build is a different app: the
            only route is uninstall and reinstall, losing the app's stored
            token and cached report.

          ### What is verified

          The unit tests pass and it compiles. It has **never been run on a
          device or an emulator** — see the table at the top of `ANDROID.md`
          for exactly which parts that leaves unproven.
          HEADER
          {
            echo ""
            echo "### Verifying the download"
            echo ""
            echo '```'
            echo "sha256  $SHA256"
            echo "file    $APK"
            echo '```'
          } >> notes.md

          gh release create "$TAG" "android/out/$APK" \
            --title "Jordan Tenders $TAG" \
            --notes-file notes.md \
            --verify-tag

      - name: Also attach it to this run
        uses: actions/upload-artifact@v4
        with:
          name: jordan-tenders-${{ steps.version.outputs.tag }}
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 90
