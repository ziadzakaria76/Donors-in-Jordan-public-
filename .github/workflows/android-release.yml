name: Android release

# Publish an installable APK as a GitHub Release.
#
# Separate from android.yml on purpose. That workflow has a `paths:` filter so
# it does not rebuild for a Python-only change -- and a `paths:` filter applies
# to tag pushes too, so putting the tag trigger there would silently skip a
# release whenever the tag's push touched nothing under android/. A release
# that quietly does not happen is exactly the failure mode this repository
# keeps designing against.
on:
  push:
    tags:
      - "v*"
  # Cutting a release from the Releases page, which is the only route that
  # needs no terminal at all: the web form creates the tag and the release
  # together, and this picks it up and attaches the APK. `published` rather
  # than `created` so a draft release does not build until it is actually
  # published.
  release:
    types: [published]
  # So a release can be re-cut, or one built for a tag that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: write   # the only job here that writes anything: the release

# Publishing from the Releases page can arrive as both a `release` and a tag
# `push`, so the same tag can start two builds. They would race on the asset
# upload. One at a time per tag, newest wins: the runs are identical, and the
# upload is the last step, so cancelling an older one cannot leave a
# half-published release behind.
concurrency:
  group: >-
    android-release-${{ github.event.release.tag_name || inputs.tag ||
    github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # On a `release` event github.ref is already the tag, but naming the
          # tag explicitly means the three triggers cannot disagree about
          # which commit is being released.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
          # The version code is the commit count, so the whole history is
          # needed. A shallow clone would produce versionCode 1 on every
          # release, and Android would install any of them over any other
          # without a word.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "APK_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "APK_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      # Debug-signed, deliberately, and the release notes say so. A release
      # keystore that is lost means every existing install can never be
      # updated again -- see ANDROID.md before changing this.
      - name: Restore the shared signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # NO SECRET IS NOT A BUILD FAILURE, but it is worth saying out loud.
          # Without the shared key Gradle invents a throwaway debug key, and the
          # APK cannot be installed over any earlier one -- Android answers
          # "App not installed" and names no cause.
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. This release APK is signed with a throwaway key and CANNOT upgrade an existing install."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shared.jks"
          echo "path=$RUNNER_TEMP/shared.jks" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Name it after the version, and checksum it
        id: package
        run: |
          mkdir -p android/out
          NAME="jordan-tenders-${{ steps.version.outputs.tag }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "android/out/$NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.package.outputs.name }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          # The ANDROID.md link below is pinned to the tag, not to main. The
          # tag is guaranteed to contain the file -- it is the commit that was
          # just built -- whereas main may not, if the release was cut from a
          # branch. A link in release notes that 404s is worse than no link.
          # Pinning also means the instructions someone reads are the ones
          # that match the APK they just downloaded.
          cat > notes.md <<'HEADER'
          Install this on the phone: tap the `.apk` below, and allow your
          browser to install unknown apps if Android asks. No sign-in needed —
          unlike the build artifacts on the Actions tab, a Release asset
          downloads without a GitHub account.

          Full instructions, and the exact token permissions the app needs:
          [`android/ANDROID.md`](${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/android/ANDROID.md).

          ### This APK is debug-signed

          That is fine for installing on your own phone and is what this
          repository does today. Two consequences worth knowing before you
          rely on it:

          - Android will warn you it is from an unknown source. Expected.
          - If this project ever switches to release signing, the new APK will
            **not** install over this one. Android identifies an app by its
            signature, so a differently-signed build is a different app: the
            only route is uninstall and reinstall, losing the app's stored
            token and cached report.

          ### What is verified

          The unit tests pass and it compiles. It has **never been run on a
          device or an emulator** — see the table at the top of `ANDROID.md`
          for exactly which parts that leaves unproven.
          HEADER
          {
            echo ""
            echo "### Verifying the download"
            echo ""
            echo '```'
            echo "sha256  $SHA256"
            echo "file    $APK"
            echo '```'
          } >> notes.md

          # Re-cutting a tag is a stated reason this workflow can be
          # dispatched by hand, and `gh release create` refuses outright when
          # the release already exists. Failing there would leave the old APK
          # published under a tag that has since moved -- the wrong build,
          # advertised as the right one. So replace in place instead, and say
          # in the log which of the two happened.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists -- replacing its asset."
            gh release upload "$TAG" "android/out/$APK" --clobber

            # A release published from the Releases page may carry notes
            # somebody wrote by hand, or GitHub's generated changelog. Those
            # are not ours to throw away, so keep them and add the install
            # instructions underneath. Only a release with no notes at all
            # gets ours as the whole body.
            EXISTING=$(gh release view "$TAG" --json body --jq .body)
            if [ -n "${EXISTING//[$' \t\n\r']/}" ]; then
              if printf '%s' "$EXISTING" | grep -qF 'Install this on the phone'; then
                echo "Notes already carry the install section -- rewriting it."
                BODY=$(printf '%s' "$EXISTING" \
                  | sed '/^Install this on the phone:/,$d')
                printf '%s\n\n%s\n' "$BODY" "$(cat notes.md)" > merged.md
              else
                echo "Keeping the existing notes and appending the install section."
                printf '%s\n\n---\n\n%s\n' "$EXISTING" "$(cat notes.md)" > merged.md
              fi
              mv merged.md notes.md
            else
              echo "The release had no notes -- using the generated ones."
            fi

            gh release edit "$TAG" \
              --notes-file notes.md
          else
            echo "Creating release $TAG."
            gh release create "$TAG" "android/out/$APK" \
              --title "Jordan Tenders $TAG" \
              --notes-file notes.md \
              --verify-tag
          fi

          echo "Release: $(gh release view "$TAG" --json url --jq .url)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Also attach it to this run
        uses: actions/upload-artifact@v4
        with:
          name: jordan-tenders-${{ steps.version.outputs.tag }}
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 90
