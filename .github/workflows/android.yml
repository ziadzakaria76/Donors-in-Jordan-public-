name: Android app

# Builds the APK and attaches it to the run, so it can be installed from the
# phone with no Android Studio anywhere in the loop.
#
# It also COMPILES the app, which is the only place that happens: the app is
# developed in an environment with no Android SDK, so a green run here is the
# first evidence that a change builds at all.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The unit tests are the ones that can run without a device: token
      # redaction, the API client's failure paths, report parsing and the
      # artifact reader. Anything needing the Android Keystore or a real
      # screen is NOT covered here, and ANDROID.md says so plainly.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK after the run
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/jordan-tenders-${{ github.run_number }}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: jordan-tenders-apk-${{ github.run_number }}
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-${{ github.run_number }}
          path: android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
