name: tests

# push is restricted to main, NOT "**". With push on every branch, each commit
# on a pull-request branch would trigger the workflow twice -- once for the push
# and once for the pull_request event -- doubling CI cost and log noise for no
# extra coverage.
on:
  push:
    branches: [main]
  pull_request:
  # Runnable by hand, against any branch.
  #
  # Not a convenience. GitHub has twice stopped turning pushes into check runs
  # on this repository -- not queued, not failed, never created -- which leaves
  # a pull request showing green ticks from an older commit and nothing
  # anywhere saying the newer ones were never tested. The Android workflows
  # could be dispatched through that outage and this one could not, so the
  # Python suite was the only thing with no way to be run at all.
  #
  # A workflow that can only be started by an event is a workflow you cannot
  # recover when the event system is the thing that is broken.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r jordan_tender_monitor/requirements.txt
          # Test-only: the YAML parser the workflow checks need, and the
          # linter. Kept out of requirements.txt so a deployment does not
          # install them. Dropping this line makes several checks fail with a
          # missing module rather than skipping silently -- see harness.yaml().
          pip install -r jordan_tender_monitor/requirements-dev.txt

      - name: Lint
        run: python -m pyflakes jordan_tender_monitor/

      # The suite uses no network and no credentials, and redirects its state
      # to a temp directory, so it is safe to run anywhere.
      - name: Offline test suite
        run: python jordan_tender_monitor/tests/run_all.py

      - name: Pipeline self-test on fixtures
        run: python jordan_tender_monitor/run.py --self-test

  # The GS3 Marketing Ops Android app: the pure-Kotlin business rules in
  # :domain -- funnel maths, budget allocation, fee calculation, SLA timing
  # across time zones, the discount guard -- and now the Android :app module
  # alongside them.
  #
  # This job used to carry a note saying the agent that wrote it could not reach
  # dl.google.com and therefore could not resolve the Android Gradle Plugin at
  # all (gs3_marketing_ops/DECISIONS.md, D-1). That host is now allowed, the SDK
  # installs, and :app is in settings.gradle.kts -- so assembleDebug runs here
  # as well as locally. The note is deleted rather than left to mislead.
  #
  # `check` is deliberately the whole gate rather than just `test`: it carries
  # the 80% coverage floor, Android Lint with warningsAsErrors, and
  # verifyStrings, which fails the build on a hardcoded UI string, on a key
  # present in one language and missing from the other, and on a phrase the
  # company must not put in writing.
  marketing-ops:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Pinned explicitly rather than trusting whatever the runner image ships.
      # That image's SDK moves without notice, and a build that quietly compiles
      # against a different platform than the one in libs.versions.toml is
      # exactly the drift the version matrix exists to prevent. sdkmanager is a
      # no-op for packages already installed, so this costs nothing when the
      # image is already correct.
      - name: Install the Android SDK packages this build pins
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed

      - name: Tests, coverage floor, lint and the bilingual guard
        run: |
          set -o pipefail
          ./gradlew check --no-daemon 2>&1 | tee /tmp/marketing-ops-check.log
        working-directory: gs3_marketing_ops

      # A failure here has to be readable from the API, not only from the web
      # UI. Raw job logs and uploaded artifacts are both served from a separate
      # storage host, which an agent behind a restricted egress allowlist cannot
      # reach -- so a red build would be a red build with no stated reason. The
      # job summary comes back through the API itself.
      - name: Put the failure where it can be read
        if: failure()
        run: |
          # Two places, because they have different readers. The job summary is
          # for a person looking at the run in a browser; the ::error::
          # annotation is the only one of the two that comes back through the
          # REST API, which is what an agent behind an egress allowlist has.
          {
            echo '## `./gradlew check` failed'
            echo '```'
            tail -n 200 /tmp/marketing-ops-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Newlines have to be percent-encoded to survive a workflow command.
          DETAIL=$(grep -E "^e: |FAILURE|What went wrong|Execution failed|Caused by|: Error:|FAILED" \
                     /tmp/marketing-ops-check.log | head -n 25 | sed 's/%/%25/g; s/\r/%0D/g' \
                   | awk '{printf "%s%%0A", $0}')
          echo "::error title=marketing-ops check failed::${DETAIL}"

      - name: Report the actual coverage figure
        run: ./gradlew coverage --no-daemon
        working-directory: gs3_marketing_ops

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: gs3_marketing_ops

      # The app is sideloaded long before it is on Play (DECISIONS.md, C5), so
      # the APK is the artefact a non-technical owner actually installs.
      # Publishing it here means a build can be handed over without anyone
      # needing a working Android toolchain of their own.
      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gs3-marketing-ops-debug-apk
          path: gs3_marketing_ops/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Lint's own report is far more useful than the console tail when it
      # fails, and it is the only place the UnusedResources hints can be read.
      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs3-marketing-ops-lint-report
          path: gs3_marketing_ops/app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  # The website is the other, unrelated project in this repository. Its content
  # file is meant to be edited by whoever is selling the units, and a mistake
  # there does not throw -- it renders a blank orientation, or a plan tab that
  # fetches a drawing nobody made. This asserts what the code assumes.
  #
  # No install step: the checker uses only Node built-ins. `sharp` is a
  # devDependency of the image tools, which CI does not run.
  website-content:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the site content against its images, pages and sitemap
        run: node tools/check-content.mjs
        working-directory: website

  # The Syria monitor is the third, unrelated project in this repository. It
  # keeps its own dependency set and its own suite, so it gets its own job
  # rather than more steps on the one above: a Jordan dependency change must
  # not be able to turn this red, or the reverse.
  #
  # These jobs came in with the project, from the CI workflow of the repository
  # it was imported from. Only the paths and the working directory changed.
  syria:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: syria_tender_monitor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: syria_tender_monitor/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes src/ tests/

      # The whole suite is offline: no network, no credentials, no real state.
      - name: Offline test suite
        run: python -m pytest tests/ -q

      - name: Pipeline self-test on fixtures
        env:
          PYTHONPATH: src
        run: python -m syria_monitor.cli --self-test

  # The browser fallback is the one scraping path verified end to end, and the
  # job above skips it (no Playwright, deliberately -- the suite must run
  # without a browser). This job installs one so the verification is not merely
  # theoretical.
  syria-browser-fallback:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: syria_tender_monitor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: syria_tender_monitor/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-browser.txt
          playwright install --with-deps chromium

      - name: Browser fallback tests
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ${{ vars.PLAYWRIGHT_CHROMIUM_PATH }}
          # Turns "browser unavailable" from a skip into a failure. A skip here
          # would let the only end-to-end-verified path rot unnoticed.
          REQUIRE_BROWSER: "1"
        run: python -m pytest tests/test_browser_fallback.py -q -rs
