name: tests

# push is restricted to main, NOT "**". With push on every branch, each commit
# on a pull-request branch would trigger the workflow twice -- once for the push
# and once for the pull_request event -- doubling CI cost and log noise for no
# extra coverage.
on:
  push:
    branches: [main]
  pull_request:
  # Runnable by hand, against any branch.
  #
  # Not a convenience. GitHub has twice stopped turning pushes into check runs
  # on this repository -- not queued, not failed, never created -- which leaves
  # a pull request showing green ticks from an older commit and nothing
  # anywhere saying the newer ones were never tested. The Android workflows
  # could be dispatched through that outage and this one could not, so the
  # Python suite was the only thing with no way to be run at all.
  #
  # A workflow that can only be started by an event is a workflow you cannot
  # recover when the event system is the thing that is broken.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r jordan_tender_monitor/requirements.txt
          # Test-only: the YAML parser the workflow checks need, and the
          # linter. Kept out of requirements.txt so a deployment does not
          # install them. Dropping this line makes several checks fail with a
          # missing module rather than skipping silently -- see harness.yaml().
          pip install -r jordan_tender_monitor/requirements-dev.txt

      - name: Lint
        run: python -m pyflakes jordan_tender_monitor/

      # The suite uses no network and no credentials, and redirects its state
      # to a temp directory, so it is safe to run anywhere.
      - name: Offline test suite
        run: python jordan_tender_monitor/tests/run_all.py

      - name: Pipeline self-test on fixtures
        run: python jordan_tender_monitor/run.py --self-test
