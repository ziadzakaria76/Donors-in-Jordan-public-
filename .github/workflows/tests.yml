name: tests

# push is restricted to main, NOT "**". With push on every branch, each commit
# on a pull-request branch would trigger the workflow twice -- once for the push
# and once for the pull_request event -- doubling CI cost and log noise for no
# extra coverage.
on:
  push:
    branches: [main]
  pull_request:
  # Runnable by hand, against any branch.
  #
  # Not a convenience. GitHub has twice stopped turning pushes into check runs
  # on this repository -- not queued, not failed, never created -- which leaves
  # a pull request showing green ticks from an older commit and nothing
  # anywhere saying the newer ones were never tested. The Android workflows
  # could be dispatched through that outage and this one could not, so the
  # Python suite was the only thing with no way to be run at all.
  #
  # A workflow that can only be started by an event is a workflow you cannot
  # recover when the event system is the thing that is broken.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r jordan_tender_monitor/requirements.txt
          # Test-only: the YAML parser the workflow checks need, and the
          # linter. Kept out of requirements.txt so a deployment does not
          # install them. Dropping this line makes several checks fail with a
          # missing module rather than skipping silently -- see harness.yaml().
          pip install -r jordan_tender_monitor/requirements-dev.txt

      - name: Lint
        run: python -m pyflakes jordan_tender_monitor/

      # The suite uses no network and no credentials, and redirects its state
      # to a temp directory, so it is safe to run anywhere.
      - name: Offline test suite
        run: python jordan_tender_monitor/tests/run_all.py

      - name: Pipeline self-test on fixtures
        run: python jordan_tender_monitor/run.py --self-test

  # The website is the other, unrelated project in this repository. Its content
  # file is meant to be edited by whoever is selling the units, and a mistake
  # there does not throw -- it renders a blank orientation, or a plan tab that
  # fetches a drawing nobody made. This asserts what the code assumes.
  #
  # No install step: the checker uses only Node built-ins. `sharp` is a
  # devDependency of the image tools, which CI does not run.
  website-content:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the site content against its images, pages and sitemap
        run: node tools/check-content.mjs
        working-directory: website

  # The Syria monitor is the third, unrelated project in this repository. It
  # keeps its own dependency set and its own suite, so it gets its own job
  # rather than more steps on the one above: a Jordan dependency change must
  # not be able to turn this red, or the reverse.
  #
  # These jobs came in with the project, from the CI workflow of the repository
  # it was imported from. Only the paths and the working directory changed.
  syria:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: syria_tender_monitor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: syria_tender_monitor/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes src/ tests/

      # The whole suite is offline: no network, no credentials, no real state.
      - name: Offline test suite
        run: python -m pytest tests/ -q

      - name: Pipeline self-test on fixtures
        env:
          PYTHONPATH: src
        run: python -m syria_monitor.cli --self-test

  # The browser fallback is the one scraping path verified end to end, and the
  # job above skips it (no Playwright, deliberately -- the suite must run
  # without a browser). This job installs one so the verification is not merely
  # theoretical.
  syria-browser-fallback:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: syria_tender_monitor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: syria_tender_monitor/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-browser.txt
          playwright install --with-deps chromium

      - name: Browser fallback tests
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ${{ vars.PLAYWRIGHT_CHROMIUM_PATH }}
          # Turns "browser unavailable" from a skip into a failure. A skip here
          # would let the only end-to-end-verified path rot unnoticed.
          REQUIRE_BROWSER: "1"
        run: python -m pytest tests/test_browser_fallback.py -q -rs
