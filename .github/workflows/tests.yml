name: tests

# push is restricted to main, NOT "**". With push on every branch, each commit
# on a pull-request branch would trigger the workflow twice -- once for the push
# and once for the pull_request event -- doubling CI cost and log noise for no
# extra coverage.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r jordan_tender_monitor/requirements.txt
          pip install pyflakes

      - name: Lint
        run: python -m pyflakes jordan_tender_monitor/

      # The suite uses no network and no credentials, and redirects its state
      # to a temp directory, so it is safe to run anywhere.
      - name: Offline test suite
        run: python jordan_tender_monitor/tests/run_all.py

      - name: Pipeline self-test on fixtures
        run: python jordan_tender_monitor/run.py --self-test

  # The GS3 Marketing Ops Android app: the pure-Kotlin business rules in
  # :domain -- funnel maths, budget allocation, fee calculation, SLA timing
  # across time zones, the discount guard -- and now the Android :app module
  # alongside them.
  #
  # This job used to carry a note saying the agent that wrote it could not reach
  # dl.google.com and therefore could not resolve the Android Gradle Plugin at
  # all (gs3_marketing_ops/DECISIONS.md, D-1). That host is now allowed, the SDK
  # installs, and :app is in settings.gradle.kts -- so assembleDebug runs here
  # as well as locally. The note is deleted rather than left to mislead.
  #
  # `check` is deliberately the whole gate rather than just `test`: it carries
  # the 80% coverage floor, Android Lint with warningsAsErrors, and
  # verifyStrings, which fails the build on a hardcoded UI string, on a key
  # present in one language and missing from the other, and on a phrase the
  # company must not put in writing.
  marketing-ops:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Pinned explicitly rather than trusting whatever the runner image ships.
      # That image's SDK moves without notice, and a build that quietly compiles
      # against a different platform than the one in libs.versions.toml is
      # exactly the drift the version matrix exists to prevent. sdkmanager is a
      # no-op for packages already installed, so this costs nothing when the
      # image is already correct.
      - name: Install the Android SDK packages this build pins
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed

      - name: Tests, coverage floor, lint and the bilingual guard
        run: ./gradlew check --no-daemon
        working-directory: gs3_marketing_ops

      - name: Report the actual coverage figure
        run: ./gradlew coverage --no-daemon
        working-directory: gs3_marketing_ops

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: gs3_marketing_ops

      # The app is sideloaded long before it is on Play (DECISIONS.md, C5), so
      # the APK is the artefact a non-technical owner actually installs.
      # Publishing it here means a build can be handed over without anyone
      # needing a working Android toolchain of their own.
      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gs3-marketing-ops-debug-apk
          path: gs3_marketing_ops/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Lint's own report is far more useful than the console tail when it
      # fails, and it is the only place the UnusedResources hints can be read.
      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs3-marketing-ops-lint-report
          path: gs3_marketing_ops/app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  # The website is the other, unrelated project in this repository. Its content
  # file is meant to be edited by whoever is selling the units, and a mistake
  # there does not throw -- it renders a blank orientation, or a plan tab that
  # fetches a drawing nobody made. This asserts what the code assumes.
  #
  # No install step: the checker uses only Node built-ins. `sharp` is a
  # devDependency of the image tools, which CI does not run.
  website-content:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the site content against its images, pages and sitemap
        run: node tools/check-content.mjs
        working-directory: website
